<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solply 스토어 — 손님으로 참여하기</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  .shop-wrap { max-width: 880px; margin: 0 auto; padding: 0 var(--pad) 80px; }
  .shop-head { padding: 30px 0 20px; }
  .shop-head .brand p { max-width: 56ch; margin-top: 6px; color: var(--ink-2); font-size: 13.5px; line-height: 1.65; }
  .shop-head a { font-size: 12.5px; }
  .shop-store { margin-top: 26px; }
  .shop-store h2 { font-size: 15px; font-weight: 750; margin: 0 0 3px; }
  .shop-store .sub { font-size: 12px; color: var(--ink-3); margin-bottom: 12px; }
  .goods { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .good {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 15px 17px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
  }
  .good .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .good .name { font-weight: 700; font-size: 13.5px; }
  .good .price { font-family: var(--mono); font-size: 13px; color: var(--accent); font-weight: 700; }
  .good .stockline { display: flex; align-items: center; gap: 9px; }
  .good .stockline .stockbar { flex: 1; }
  .good .qtytxt { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .good button {
    align-self: stretch; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
    border: none; border-radius: 7px; padding: 8px 0; color: #04231a;
    background: linear-gradient(135deg, var(--accent-vivid), var(--accent-cyan));
  }
  .good button:disabled { background: var(--raise); color: var(--ink-3); cursor: default; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    max-width: min(560px, calc(100vw - 40px));
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 12px 16px; font-size: 13px; line-height: 1.6;
    box-shadow: 0 10px 34px rgba(23,33,27,.14); color: var(--ink-2);
  }
  .toast b { color: var(--ink); }
  .toast.warn { border-left-color: var(--warn-vivid); }
  .howto {
    margin-top: 34px; padding: 15px 18px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; font-size: 12.5px; color: var(--ink-2);
    line-height: 1.7;
  }
</style>
</head>
<body>
<div class="shop-wrap">
  <header class="shop-head">
    <div class="brand" style="align-items:flex-start">
      <span class="mark" style="margin-top:3px"></span>
      <div>
        <h1 style="margin:0; font-size:17px; font-weight:650">Solply 스토어</h1>
        <p>여기서의 구매는 진짜 수요가 됩니다 — 재고가 안전선을 깨면 <b style="color:var(--ink)">지점 에이전트가 스스로 조달(직거래·발주)을 시작하고 온체인으로 정산</b>합니다. 여러분이 방금 누른 버튼이 10분 안에 에이전트 상거래를 일으키는 걸 <a href="/">대시보드</a>에서 지켜보세요.</p>
      </div>
    </div>
  </header>

  <div id="stores"><div class="empty">진열대를 불러오는 중…</div></div>

  <div class="howto">
    <b style="color:var(--ink)">동작 원리</b> — 손님 결제는 카드(체인 밖)로 이뤄지고, 매출은 지점 금고에 적립됐다가
    다음 정산 틱에 <b style="color:var(--ink)">온체인 USDC로 지급</b>됩니다. 구매 → 재고 감소 → 에이전트 조달 →
    x402 정산의 전 과정이 실행 증빙으로 남습니다.
  </div>
</div>
<script type="module" src="/assets/shop.js"></script>
</body>
</html>
