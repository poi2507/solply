[project]
name = "solply-guard"
version = "0.1.0"
description = "Guardrails for AI agents that hold a wallet: spend limits, on-chain payment checks, confidence gates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solply_guard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
